<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Atividade web-105</title>

    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <th colspan="2">Siglas Sudeste</th>
        </tr>

            <td>São Paulo</td>
        </tr>
        <tr>
            <td>MG</td>

        </tr>
        <tr>
            <td>RJ</td>
            <td>Rio de Janeiro</td>
        </tr>

        </tr>

    <hr>

    <h2>Formulário</h2>

        <input type="text" placeholder="lorem ipsum"> <br>

        <input type="email" placeholder="meuemail@email.com" required> <br>
        
        <label>Senha:</label> <br>
        <input type="password" required> <br>
        
        <label>Número:</label> <br>
        <input type="number"> <br>

        <input type="date"> <br>

        <br><input type="submit">
    </form>
    
</body>
